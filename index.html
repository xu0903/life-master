<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/life-master/pwa-192x192.png" />
    <link rel="apple-touch-icon" href="/life-master/apple-touch-icon-180x180.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f1f5f9" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="LifeMaster" />
    <title>LifeMaster</title>
    <script>
      // 在 React 載入前先套用主題，避免開啟時閃一下預設色
      try {
        var id = JSON.parse(localStorage.getItem('lifemaster.theme') || '"classic"')
        var dark = matchMedia('(prefers-color-scheme: dark)').matches
        var darkThemes = ['obsidian', 'midnight', 'forest']
        if (id === 'auto') id = dark ? 'midnight' : 'classic'
        document.documentElement.dataset.theme = id
        document.documentElement.dataset.mode = darkThemes.indexOf(id) >= 0 ? 'dark' : 'light'
      } catch (e) {}
      // 使用者選的 App 圖示要在「加入主畫面」之前就換好
      try {
        var icon = JSON.parse(localStorage.getItem('lifemaster.appIcon') || '8')
        if (icon >= 1 && icon <= 9 && icon !== 8) {
          var base = document.querySelector('link[rel="apple-touch-icon"]').getAttribute('href').replace('apple-touch-icon-180x180.png', '')
          document.querySelector('link[rel="apple-touch-icon"]').setAttribute('href', base + 'icons/icon-' + icon + '-180.png')
          document.querySelector('link[rel="icon"]').setAttribute('href', base + 'icons/icon-' + icon + '-192.png')
        }
      } catch (e) {}
    </script>
    <script type="module" crossorigin src="/life-master/assets/index-l3Tz9mlm.js"></script>
    <link rel="stylesheet" crossorigin href="/life-master/assets/index-8hlEZl0S.css">

  <body>
    <div id="root"></div>
  </body>
</html>
