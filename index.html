<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon-180x180.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f1f5f9" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="LifeMaster" />
    <title>LifeMaster</title>
    <script>
      // 在 React 載入前先套用主題，避免開啟時閃一下預設色
      try {
        var id = JSON.parse(localStorage.getItem('lifemaster.theme') || '"auto"')
        var dark = matchMedia('(prefers-color-scheme: dark)').matches
        var darkThemes = ['obsidian', 'midnight', 'forest']
        if (id === 'auto') id = dark ? 'midnight' : 'classic'
        document.documentElement.dataset.theme = id
        document.documentElement.dataset.mode = darkThemes.indexOf(id) >= 0 ? 'dark' : 'light'
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
